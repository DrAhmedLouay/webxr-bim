<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥽 منصة WebXR BIM المتقدمة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #1a1f35 100%);
            color: #ffffff;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(14px);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.2rem;
            color: #38bdf8;
            margin: 0;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #0369a1;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #22c55e;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        #info {
            position: absolute;
            bottom: 25px;
            right: 25px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(14px);
            padding: 15px 20px;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            z-index: 100;
            max-width: 350px;
        }

        #info h3 {
            color: #38bdf8;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        #info p {
            font-size: 0.85rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin: 5px 0;
        }

        .status {
            display: inline-block;
            padding: 4px 10px;
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: 10px;
        }

        #vrButton {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loading.hidden {
            display: none;
        }

        .loading-icon {
            font-size: 4rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #38bdf8;
        }

        @media (max-width: 768px) {
            #header {
                flex-direction: column;
                gap: 10px;
            }
            
            #info {
                left: 20px;
                right: 20px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-icon">🥽</div>
        <div class="loading-text">جاري تحميل المحرك الثلاثي الأبعاد...</div>
    </div>

    <div id="container"></div>

    <div id="header">
        <div>
            <h1>🥽 منصة WebXR BIM المتقدمة</h1>
            <div class="subtitle">نظام مراجعة التصاميم بمقياس 1:1 | د. أحمد لؤي أحمد</div>
        </div>
        <div class="btn-group">
            <button class="btn btn-success" onclick="uploadModel()">📂 استيراد نموذج</button>
            <button class="btn" onclick="detectClashes()">🔍 كشف التعارضات</button>
            <button class="btn" onclick="resetCamera()">🎯 إعادة التوسيط</button>
        </div>
    </div>

    <div id="info">
        <h3>📊 معلومات المشهد</h3>
        <p>العناصر: <strong id="objects">0</strong></p>
        <p>المضلعات: <strong id="triangles">0</strong></p>
        <p>FPS: <strong id="fps">60</strong></p>
        <div class="status">✅ جاهز للاستخدام</div>
    </div>

    <input type="file" id="fileInput" accept=".glb,.gltf,.ifc" style="display: none;">

    <!-- Three.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/webxr/VRButton.js"></script>

    <script>
        let scene, camera, renderer, controls, clock;
        let loadedModel = null;

        // Wait for Three.js to load
        function init() {
            if (typeof THREE === 'undefined') {
                console.log('Waiting for Three.js...');
                setTimeout(init, 100);
                return;
            }

            console.log('Three.js loaded successfully!');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(5, 3, 5);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.xr.enabled = true;
            renderer.shadowMap.enabled = true;
            document.getElementById('container').appendChild(renderer.domElement);

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const directional = new THREE.DirectionalLight(0xffffff, 0.8);
            directional.position.set(10, 10, 5);
            directional.castShadow = true;
            scene.add(directional);

            // Grid
            const grid = new THREE.GridHelper(20, 20, 0x38bdf8, 0x1e293b);
            scene.add(grid);

            // Sample object
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                roughness: 0.5,
                metalness: 0.5
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.y = 1;
            cube.castShadow = true;
            scene.add(cube);

            // VR Button
            const vrButton = THREE.VRButton.createButton(renderer);
            vrButton.id = 'vrButton';
            document.body.appendChild(vrButton);

            // Clock
            clock = new THREE.Clock();

            // Hide loading
            document.getElementById('loading').classList.add('hidden');

            // Start animation
            renderer.setAnimationLoop(animate);

            // Window resize
            window.addEventListener('resize', onWindowResize);

            console.log('✅ Platform initialized successfully!');
        }

        function animate() {
            controls.update();
            renderer.render(scene, camera);
            updateStats();
        }

        function updateStats() {
            document.getElementById('objects').textContent = scene.children.length;
            document.getElementById('triangles').textContent = 
                renderer.info.render.triangles.toLocaleString('ar');
            document.getElementById('fps').textContent = 
                Math.round(1 / clock.getDelta());
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function resetCamera() {
            camera.position.set(5, 3, 5);
            camera.lookAt(0, 0, 0);
            controls.target.set(0, 0, 0);
            showNotification('تم إعادة توسيط الكاميرا');
        }

        function uploadModel() {
            document.getElementById('fileInput').click();
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                loadModel(file);
            }
        });

        function loadModel(file) {
            showNotification('جاري تحميل النموذج...');
            const reader = new FileReader();
            reader.onload = (e) => {
                const loader = new THREE.GLTFLoader();
                loader.parse(e.target.result, '', (gltf) => {
                    if (loadedModel) {
                        scene.remove(loadedModel);
                    }
                    loadedModel = gltf.scene;
                    scene.add(loadedModel);

                    // Center model
                    const box = new THREE.Box3().setFromObject(loadedModel);
                    const center = box.getCenter(new THREE.Vector3());
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const scale = 5 / maxDim;
                    
                    loadedModel.scale.multiplyScalar(scale);
                    loadedModel.position.sub(center.multiplyScalar(scale));

                    showNotification('✅ تم تحميل النموذج بنجاح!');
                }, (error) => {
                    console.error('Error:', error);
                    showNotification('❌ فشل تحميل النموذج');
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function detectClashes() {
            showNotification('🔍 جاري فحص التعارضات... (قيد التطوير)');
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.textContent = message;
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(15, 23, 42, 0.98);
                color: white;
                padding: 12px 24px;
                border-radius: 8px;
                border: 1px solid #38bdf8;
                z-index: 10000;
                font-size: 0.9rem;
                animation: slideIn 0.3s ease;
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        // Start initialization
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }

        console.log('%c🥽 منصة WebXR BIM المتقدمة', 'color: #38bdf8; font-size: 20px; font-weight: bold;');
        console.log('%cد. أحمد لؤي أحمد - الإصدار 2.0', 'color: #22c55e; font-size: 14px;');
    </script>
</body>
</html>
